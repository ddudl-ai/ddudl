<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공사중</title>
  <meta name="description" content="현재 사이트를 새로 만들고 있습니다. 곧 다시 찾아와 주세요.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.78);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #fb923c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.22), transparent 34%),
        radial-gradient(circle at bottom, rgba(251, 146, 60, 0.18), transparent 28%),
        linear-gradient(180deg, #020617 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(680px, 100%);
      padding: 48px 32px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.45);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    p {
      margin: 20px auto 0;
      max-width: 32rem;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 12px 18px;
      border: 1px solid rgba(251, 146, 60, 0.28);
      border-radius: 999px;
      background: rgba(251, 146, 60, 0.12);
      color: #fed7aa;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent-2);
      box-shadow: 0 0 18px rgba(251, 146, 60, 0.9);
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">DDUDL</p>
    <h1>공사중</h1>
    <p>사이트를 새로 만들고 있습니다. 잠시만 기다려 주세요. 곧 다시 열겠습니다.</p>
    <div class="status">
      <span class="dot"></span>
      임시 안내 페이지
    </div>
  </main>
</body>
</html>
